name: TrendRadar Scheduled Push

on:
  schedule:
    # 北京时间 11:00（UTC+8）对应 UTC 03:00
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  run-trendradar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r TrendRadar/requirements.txt

      - name: Run TrendRadar
        env:
          CONFIG_PATH: TrendRadar/config/config.yaml
          REPORT_MODE: current
          PUSH_WINDOW_ENABLED: "true"
          PUSH_WINDOW_START: "10:00"
          PUSH_WINDOW_END: "20:00"
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
        run: |
          python TrendRadar/main.py


name: Daily Publish And Feishu Push
on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
env:
  TZ: Asia/Shanghai

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone TrendRadar
        run: |
          REPO="${{ secrets.TRENDRADAR_REPO }}"
          REF="${{ secrets.TRENDRADAR_REF }}"
          if [ -z "$REPO" ]; then REPO="sansan0/TrendRadar"; fi
          git clone --depth 1 https://github.com/$REPO TrendRadar
          if [ -n "$REF" ]; then
            cd TrendRadar && git fetch --depth 1 origin "$REF" && git checkout "$REF" && cd ..
          fi

      - name: Ensure config and frequency words
        run: |
          mkdir -p TrendRadar/config
          [ -f TrendRadar/config/config.yaml ] || curl -fsSL https://raw.githubusercontent.com/sansan0/TrendRadar/master/TrendRadar/config/config.yaml -o TrendRadar/config/config.yaml || true
          [ -f TrendRadar/config/frequency_words.txt ] || curl -fsSL https://raw.githubusercontent.com/sansan0/TrendRadar/master/TrendRadar/config/frequency_words.txt -o TrendRadar/config/frequency_words.txt || true
          [ -s TrendRadar/config/frequency_words.txt ] || printf "AI\n人工智能\nAIGC\n大模型\nLLM\n" > TrendRadar/config/frequency_words.txt
          [ -s TrendRadar/config/config.yaml ] || printf "app:\n  public_report_url: \"\"\nreport:\n  mode: \"current\"\nnotification:\n  feishu_message_type: \"post\"\n  push_window:\n    enabled: false\n    once_per_day: true\nplatforms: []\n" > TrendRadar/config/config.yaml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r TrendRadar/requirements.txt

      - name: Prepare overrides
        run: |
          python -c "import yaml,pathlib; p=pathlib.Path('TrendRadar/config/config.yaml'); d=yaml.safe_load(p.read_text(encoding='utf-8')) or {}; d.setdefault('notification',{}).setdefault('push_window',{}); d.setdefault('report',{})['mode']='current'; d['notification']['feishu_message_type']='post'; d['notification']['feishu_section_separator']='━━━━━━━━━━━━━━━━━━━'; d['notification']['feishu_item_bullet']='📌'; d['notification']['feishu_new_icon']='🆕'; d['notification']['push_window']['enabled']=False; d['notification']['push_window']['once_per_day']=True; p.write_text(yaml.dump(d,allow_unicode=True),encoding='utf-8')"

      - name: Run TrendRadar and push Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ENABLE_NOTIFICATION: 'true'
          PUSH_WINDOW_ENABLED: 'false'
          PUSH_WINDOW_ONCE_PER_DAY: 'true'
          PUBLIC_REPORT_URL: ${{ secrets.PUBLIC_REPORT_URL }}
          CONFIG_PATH: 'TrendRadar/config/config.yaml'
        run: |
          python TrendRadar/main.py

      - name: Publish report to docs/reports
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p docs/reports
          REPORT=$(find TrendRadar/output -type f -name '当日汇总.html' | sort | tail -n 1 || true)
          [ -n "$REPORT" ] || REPORT=$(find TrendRadar/output -type f -name '*.html' | sort | tail -n 1 || true)
          if [ -n "$REPORT" ]; then
            cp "$REPORT" "docs/reports/${DATE}.html"
            python -c "import pathlib; b=pathlib.Path('docs'); rs=sorted((b/'reports').glob('*.html'),reverse=True); items=''.join([f\"<li><a href='reports/{p.name}'>{p.stem}</a></li>\" for p in rs]); html=(\"<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'/><title>TrendRadar 历史报告</title><meta name='viewport' content='width=device-width, initial-scale=1'/><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:960px;margin:40px auto;padding:0 16px}h1{font-size:22px;margin-bottom:10px}ul{line-height:1.9}a{color:#0366d6;text-decoration:none}</style></head><body><h1>TrendRadar 历史报告</h1><ul>\"+items+\"</ul></body></html>\"); (b/'index.html').write_text(html,encoding='utf-8')"
          else
            echo "No report generated"; exit 0
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/reports/*.html
          git commit -m "Publish report at $(date +'%Y-%m-%d %H:%M:%S %Z')" || echo "No changes"
          git push

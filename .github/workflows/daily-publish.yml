name: Daily Publish And Feishu Push

on:
  schedule:
    - cron: '30 9 * * *'   # UTC 09:30 = 北京时间 17:30
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Pages repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone TrendRadar
        run: |
          REPO="${{ secrets.TRENDRADAR_REPO }}"
          REF="${{ secrets.TRENDRADAR_REF }}"
          if [ -z "$REPO" ]; then REPO="sansan0/TrendRadar"; fi
          git clone --depth 1 https://github.com/$REPO TrendRadar
          if [ -n "$REF" ]; then
            cd TrendRadar && git fetch --depth 1 origin $REF && git checkout $REF && cd ..
          fi

      - name: Ensure config and frequency words exist
        run: |
          mkdir -p TrendRadar/config
          # 下载默认配置（若不可用则写入最小配置）
          if [ ! -f TrendRadar/config/config.yaml ]; then
            curl -fsSL https://raw.githubusercontent.com/sansan0/TrendRadar/master/TrendRadar/config/config.yaml -o TrendRadar/config/config.yaml || true
          fi
          if [ ! -s TrendRadar/config/config.yaml ]; then
            cat > TrendRadar/config/config.yaml <<'YAML'
app:
  public_report_url: ""
  show_version_update: false
report:
  mode: "current"
  rank_threshold: 5
notification:
  enable_notification: true
  message_batch_size: 4000
  dingtalk_batch_size: 20000
  feishu_batch_size: 29000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"
  feishu_message_type: "post"
  push_window:
    enabled: false
    once_per_day: true
platforms: []
YAML
          fi
          # 下载频率词
          if [ ! -f TrendRadar/config/frequency_words.txt ]; then
            curl -fsSL https://raw.githubusercontent.com/sansan0/TrendRadar/master/TrendRadar/config/frequency_words.txt -o TrendRadar/config/frequency_words.txt || true
          fi
          # 若下载失败则写入基础关键词
          if [ ! -s TrendRadar/config/frequency_words.txt ]; then
            printf "AI\n人工智能\nAIGC\n大模型\nLLM\n" > TrendRadar/config/frequency_words.txt
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r TrendRadar/requirements.txt

      - name: Prepare overrides
        run: |
          python - <<'PY'
          import yaml, pathlib
          p = pathlib.Path('TrendRadar/config/config.yaml')
          data = yaml.safe_load(p.read_text(encoding='utf-8'))
          data.setdefault('notification', {}).setdefault('push_window', {})
          # 使用 current + incremental 合并推送（有增量双段，无增量仅当前榜单）
          data['report']['mode'] = 'current'
          data['notification']['feishu_message_type'] = 'post'
          data['notification']['feishu_section_separator'] = '━━━━━━━━━━━━━━━━━━━'
          data['notification']['feishu_item_bullet'] = '📌'
          data['notification']['feishu_new_icon'] = '🆕'
          data['notification']['push_window']['enabled'] = False
          data['notification']['push_window']['once_per_day'] = True
          p.write_text(yaml.dump(data, allow_unicode=True), encoding='utf-8')
          PY

      - name: Run TrendRadar and push Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ENABLE_NOTIFICATION: 'true'
          PUSH_WINDOW_ENABLED: 'false'
          PUSH_WINDOW_ONCE_PER_DAY: 'true'
          PUBLIC_REPORT_URL: ${{ secrets.PUBLIC_REPORT_URL }}
          CONFIG_PATH: 'TrendRadar/config/config.yaml'
        run: |
          python TrendRadar/main.py

      - name: Publish report to docs/reports
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p docs/reports
          REPORT=$(find TrendRadar/output -type f -name '当日汇总.html' | sort | tail -n 1 || true)
          if [ -z "$REPORT" ]; then
            REPORT=$(find TrendRadar/output -type f -name '*.html' | sort | tail -n 1 || true)
          fi
          if [ -z "$REPORT" ]; then
            echo "No report generated"; exit 0
          fi
          cp "$REPORT" "docs/reports/${DATE}.html"
          python - <<'PY'
          import pathlib
          base = pathlib.Path('docs')
          reports = sorted((base / 'reports').glob('*.html'), reverse=True)
          items = [f"<li><a href='reports/{p.name}'>{p.stem}</a></li>" for p in reports]
          html = ("<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'/>"
                  "<title>TrendRadar 历史报告</title><meta name='viewport' content='width=device-width, initial-scale=1'/>"
                  "<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:960px;margin:40px auto;padding:0 16px}"
                  "h1{font-size:22px;margin-bottom:10px}ul{line-height:1.9}a{color:#0366d6;text-decoration:none}</style>"
                  "</head><body><h1>TrendRadar 历史报告</h1><ul>"
                  + "".join(items) +
                  "</ul></body></html>")
          (base / 'index.html').write_text(html, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/reports/*.html .github/workflows/daily-publish.yml
          git commit -m "Publish report & run Feishu push at $(date +'%Y-%m-%d %H:%M:%S %Z')" || echo "No changes to commit"
          git push
